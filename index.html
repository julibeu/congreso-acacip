/* Credencial */
.badge{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.badge-top{background:var(--badge);color:var(--badge-ink);padding:20px;display:flex;gap:16px;align-items:center}
.badge-top .logo-mark{flex:none;width:76px;height:76px;box-shadow:0 0 0 4px rgba(255,255,255,.18)}
.badge-top .tx{min-width:0}
.badge-top .org{font-family:var(--display);font-weight:500;letter-spacing:.24em;font-size:13px;opacity:.85}
.badge-top h1{font-weight:300;font-size:clamp(22px,6.2vw,28px);line-height:1.12;margin-top:4px}
.badge-top h1 b{font-weight:700;display:block}
.badge-meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 20px 16px;border-top:3px solid var(--sky)}
.badge-meta div{min-width:0}
.badge-meta strong{display:block;font-weight:600;font-size:15px;overflow-wrap:anywhere}
.notice{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:15px}
.banners{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.banners::-webkit-scrollbar{display:none}
.banner{flex:none;width:86%;scroll-snap-align:start;background:var(--accent-soft);border-left:4px solid var(--sky);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.banner b{font-family:var(--display);font-weight:500;font-size:17px}
.banner strong{font-weight:600;font-size:15px}
.banner span{font-size:14px;color:var(--muted)}
.dots{display:flex;justify-content:center;gap:6px;margin-top:8px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}

/* Botonera */
.menu{display:flex;flex-direction:column;gap:10px}
.tile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:14px 16px;cursor:pointer;transition:transform .12s,border-color .12s}
.tile:hover{border-color:var(--accent)}
.tile:active{transform:scale(.985)}
.tile .ic{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.tile.hot .ic{background:var(--buy-soft);color:var(--buy)}
.tile .tx{flex:1;min-width:0}
.tile .tx b{display:block;font-family:var(--display);font-size:18px;font-weight:500}
.tile .tx span{display:block;color:var(--muted);font-size:14px}
.tile .chev{color:var(--muted);flex:none}
.pill{display:inline-block;font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--buy);color:var(--buy-ink);margin-left:6px;vertical-align:2px}
.tile .tx .pill{display:inline-block;color:var(--buy-ink)}
.quick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
footer{display:flex;flex-direction:column;gap:2px;text-align:center;font-size:13px;color:var(--muted)}
footer .sel{user-select:all}

/* Detalle */
.bar{display:flex;align-items:center;gap:10px}
.back{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;background:var(--surface)}
.view-head h2{font-size:28px;font-weight:500}
.view-head p{color:var(--muted);margin-top:4px}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card h3{font-size:19px;font-weight:500}
.card .photo{display:block;width:calc(100% + 32px);max-width:calc(100% + 32px);margin:-16px -16px 0;aspect-ratio:16/9;object-fit:cover;border-radius:13px 13px 0 0;background:var(--accent-soft)}
.flyer{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.flyer summary{cursor:pointer;padding:10px 14px;font-weight:600;font-size:15px;color:var(--accent)}
.flyer img{display:block;width:100%;max-width:100%}
.menu-list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:2px;font-size:15px}
.ph-ed{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ph-ed img{width:96px;max-width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px}
.when{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.when span{display:inline-flex;gap:6px;align-items:center}
.row-actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:11px 16px;font-weight:600;font-size:15px;text-decoration:none;cursor:pointer;border:1px solid transparent;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.buy{background:var(--buy);color:var(--buy-ink)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.small{padding:8px 12px;font-size:14px}
.btn.block{width:100%}
.btn[aria-disabled="true"]{opacity:.55;cursor:default}
.price{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.sched{display:flex;flex-direction:column}
.sched h4{font-family:var(--display);font-weight:500;font-size:16px;margin:14px 0 2px;color:var(--accent)}
.sched h4:first-child{margin-top:0}
.sched .r{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.sched .t{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);padding-top:2px}
.sched .r span{min-width:0}
.party{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.party-top{background:var(--badge);color:var(--badge-ink);padding:20px;border-bottom:3px solid var(--sky)}
.party-top h2{font-size:28px;font-weight:500;margin-top:4px}
.party-top .label{color:inherit;opacity:.85}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:18px 20px}
.dl div{min-width:0}
.dl strong{display:block;font-weight:600;overflow-wrap:anywhere}
.party .pad{padding:0 20px 20px;display:flex;flex-direction:column;gap:12px}
.tiers{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tiers div{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-top:1px solid var(--line);font-size:15px}
.tiers div:first-child{border-top:0}
.tiers .price{flex:none;white-space:nowrap}
.tiers .off{color:var(--muted);text-decoration:line-through}
.incl{display:flex;flex-wrap:wrap;gap:6px}
.empty{text-align:center;color:var(--muted);padding:28px 16px;border:1px dashed var(--line);border-radius:14px}

/* Organizador */
.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:20;
  background:var(--ink);color:var(--bg);border:0;border-radius:99px;padding:12px 18px;font-weight:600;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.admin{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 100px) max(16px,env(safe-area-inset-left,0px))}
.admin-in{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tab{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:15px}
.field textarea{min-height:84px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .wide{grid-column:1/-1}
.ed-item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ed-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ed-head b{font-family:var(--display);font-weight:500;font-size:17px;min-width:0;overflow-wrap:anywhere}
.link-btn{background:none;border:0;color:var(--buy);font-weight:600;cursor:pointer;padding:4px}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-top:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(16px,env(safe-area-inset-left,0px))}
.savebar-in{max-width:620px;margin:0 auto;display:flex;gap:10px;align-items:center}
.savebar .msg{flex:1;min-width:0;font-size:14px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}
@media (max-width:380px){.grid2,.badge-meta,.dl{grid-template-columns:1fr}.sched .r{grid-template-columns:78px 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

function imgEd(it,i,fld,lab){var id='ph-'+fld+'-'+i;return '<div class="field"><label for="'+id+'">'+lab+'</label><div class="ph-ed">'+(it[fld]?'<img src="'+esc(it[fld])+'" alt=""><button class="link-btn" data-nophoto="'+i+'" data-field="'+fld+'">Quitar</button>':'')+'<input type="file" id="'+id+'" accept="image/*" data-photo="'+i+'" data-field="'+fld+'"></div></div>';}
var PW_HASH='ae5e83f8d7f0186cdfcf9e46fb109d13ed5a4c20b1fabb3fa2aca8ac5b2631df',lockOpen=false,lockMsg='',unlocked=false;
try{unlocked=sessionStorage.getItem('org-ok')==='1';}catch(e){}
function openAdmin(){draft=JSON.parse(JSON.stringify(S));adminOpen=true;lockOpen=false;saveMsg='';render();}
function lockHtml(){return '<div class="admin" role="dialog" aria-label="Acceso de organizador"><form class="admin-in" id="lock-form" style="max-width:380px;margin-top:12vh"><h2 style="font-size:24px;font-weight:500">Acceso de organizador</h2><div class="field"><label for="lock-pw">Contraseña</label><input type="password" id="lock-pw" autocomplete="current-password" required></div>'+(lockMsg?'<p class="notice">'+esc(lockMsg)+'</p>':'')+'<div class="row-actions"><button type="submit" class="btn primary">Entrar</button><button type="button" class="btn ghost" data-lockclose="1">Cancelar</button></div></form></div>';}
function sha256(t){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2);}).join('');});}
app.addEventListener('submit',function(e){if(e.target.id!=='lock-form')return;e.preventDefault();var v=(document.getElementById('lock-pw')||{}).value||'';
  Promise.resolve().then(function(){return sha256(v.trim());}).then(function(h){if(h===PW_HASH){unlocked=true;try{sessionStorage.setItem('org-ok','1');}catch(x){}openAdmin();}else{lockMsg='Contraseña incorrecta. Revisá mayúsculas y volvé a intentar.';render();var pw=document.getElementById('lock-pw');if(pw)pw.focus();}})
  .catch(function(){lockMsg='Este navegador no pudo verificar la contraseña. Probá desde otro navegador.';render();});});
function setPath(path,val){var p=path.split('.'),o=draft;for(var i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=val;}

function buildDoc(state){
  var resetEl=document.head&&document.head.querySelector('style:not(#app-style)');
  var reset=resetEl?resetEl.textContent:'';
  function oh(id){var el=document.getElementById(id);return el?el.outerHTML:'';}
  var json=JSON.stringify(state).replace(/</g,'\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+
    oh('meta-title')+'\n'+oh('meta-vf')+'\n'+oh('app-style')+'\n<div id="app"></div>\n<script type="application/json" id="state">'+json+'</'+'script>\n'+oh('app-script')+'</body></html>';
}
function save(){
  if(saving||!artifactNs)return;
  var next=JSON.parse(JSON.stringify(draft));
  saving=true;saveMsg='';render();
  artifactNs.publish(buildDoc(next)).then(function(){saving=false;saveMsg='Publicado. La página se recarga con la nueva versión.';S=next;render();})
  .catch(function(err){saving=false;var c=err&&err.code;
    saveMsg=c==='conflict'?'Otra persona publicó cambios recién. Se carga su versión; revisá y volvé a publicar.':(c==='not_writer'||c==='not_granted')?'Esta cuenta solo puede ver la página. Pedile al dueño acceso de edición.':'No se pudo publicar ('+(c||'error')+'). Probá de nuevo en un momento.';
    if(c==='not_writer'||c==='not_granted'){readOnly=true;}
    render();});
}

function render(){
  var html={home:home,programa:programa,turismo:turismo,noche:noche,almuerzo:almuerzo,cena:cena}[view]();
  if(adminOpen)html+=adminHtml();
  if(lockOpen)html+=lockHtml();
  app.innerHTML=html;
}

app.addEventListener('click',function(e){
  var t=e.target.closest('[data-go],[data-admin],[data-close],[data-tab],[data-add],[data-del],[data-save],[data-nophoto],[data-lockclose]');if(!t)return;
  if(t.dataset.lockclose){lockOpen=false;lockMsg='';render();return;}
  if(t.dataset.go){go(t.dataset.go);return;}
  if(t.dataset.admin){if(!unlocked){lockOpen=true;lockMsg='';render();var pw=document.getElementById('lock-pw');if(pw)pw.focus();return;}openAdmin();return;}
  if(t.dataset.close){adminOpen=false;render();return;}
  if(t.dataset.tab){adminTab=t.dataset.tab;render();return;}
  if(t.dataset.add){var o={id:'i'+Date.now()};SCHEMA[adminTab].f.forEach(function(f){o[f[0]]='';});draft[adminTab].push(o);render();return;}
  if(t.dataset.del){draft[adminTab].splice(+t.dataset.del,1);render();return;}
  if(t.dataset.save){save();return;}
  if(t.dataset.nophoto){draft[adminTab][+t.dataset.nophoto][t.dataset.field||'foto']='';render();}
});
app.addEventListener('input',function(e){
  var p=e.target.dataset&&e.target.dataset.path;if(!p)return;setPath(p,e.target.value);
  if(/\.(titulo|nombre)$/.test(p)){var h=e.target.closest('.ed-item');var b=h&&h.querySelector('.ed-head b');if(b)b.textContent=e.target.value||'Sin título';}
});
app.addEventListener('change',function(e){
  if(e.target.dataset&&e.target.dataset.photo!=null){var pf=e.target.files&&e.target.files[0];if(!pf)return;var idx=+e.target.dataset.photo,tab=adminTab,fld=e.target.dataset.field||'foto';var rd=new FileReader();rd.onload=function(){var im=new Image();im.onload=function(){var W=Math.min(fld==='flyer'?720:960,im.width),H=Math.round(im.height*W/im.width);var cv=document.createElement('canvas');cv.width=W;cv.height=H;cv.getContext('2d').drawImage(im,0,0,W,H);draft[tab][idx][fld]=cv.toDataURL('image/jpeg',0.78);saveMsg='Foto lista. Tocá “Publicar cambios” para que la vean todos.';render();};im.onerror=function(){saveMsg='No se pudo leer esa imagen. Probá con un JPG o PNG.';render();};im.src=rd.result;};rd.readAsDataURL(pf);return;}
  if(e.target.id!=='pdf-file'||!assetsNs)return;var f=e.target.files&&e.target.files[0];if(!f)return;
  var msg=document.getElementById('save-msg');if(msg)msg.textContent='Subiendo PDF…';
  assetsNs.upload(f).then(function(r){draft.programa.pdfUrl=r.url;saveMsg='PDF subido. Tocá “Publicar cambios” para que lo vean todos.';render();})
  .catch(function(err){saveMsg='No se pudo subir el PDF ('+((err&&err.code)||'error')+'). Podés pegar un link de Drive o Dropbox.';render();});
});

app.addEventListener('scroll',function(e){var t=e.target;if(!t.classList||!t.classList.contains('banners')||t.children.length<2)return;var step=t.children[1].offsetLeft-t.children[0].offsetLeft,i=Math.round(t.scrollLeft/step),d=t.nextElementSibling;if(d)Array.prototype.forEach.call(d.children,function(x,k){x.className=k===i?'on':'';});},true);
var h=(location.hash||'').replace('#','');if(VIEWS.indexOf(h)>-1)view=h;
render();

if(window.claude&&window.claude.use){
  Promise.all([window.claude.use('user'),window.claude.use('artifact'),window.claude.use('assets')]).then(function(r){
    var user=r[0];artifactNs=r[1];assetsNs=r[2];
    if(!user||!artifactNs)return;
    return user.canEdit().then(function(ok){canEdit=!!ok;render();});
  }).catch(function(){});
}
})();
</script>
